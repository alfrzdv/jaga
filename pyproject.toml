[project]
name = "jaga"
version = "0.1.0"
requires-python = ">=3.14.10"
dependencies = [
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "python-telegram-bot==22.8",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
